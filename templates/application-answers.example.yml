# application-answers.example.yml — the answer bank the apply tools read.
#
# Copy to data/application-answers.yml (user layer: gitignored, never committed)
# and fill it in from YOUR cv.md and your own decisions. Every value here is a
# statement you are making to an employer, so:
#   - leave a field blank rather than guess; a blank makes the runner ASK you
#   - sensitive categories (demographics) are answered ONLY if you fill them in;
#     list anything you never want answered under demographics.never_answer
#   - free_text.stories are your own first-person answers, in your own words.
#     Placeholders {termA} {termB} {company} {role} are filled from the posting.
#   - match_question lists are generic question patterns; keep or extend them.
#   - cv.final_path / cv.final_sha256: the one PDF you upload everywhere.
#     Get the hash with:  shasum -a 256 "path/to/your CV.pdf"
#
